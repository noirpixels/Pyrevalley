<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brielands</title>
<link rel="icon" href="files/index.icon.png">
<style>
  html, body { margin: 0; height: 100%; background: #101830; color: #fff;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .menu { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 18px; text-align: center; padding: 16px; box-sizing: border-box;
    background: radial-gradient(ellipse at 50% 120%, #ff7a2f55, transparent 60%), linear-gradient(#1d2a50, #0c1226); }
  h1 { margin: 0; font-size: clamp(40px, 9vw, 96px); letter-spacing: 3px; color: #ffc94a;
    text-shadow: 0 5px 0 #2a1420, 0 0 30px #ffb02f88; }
  p { margin: 0; font-size: clamp(15px, 2.4vw, 22px); opacity: .9; }
  .buttons { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; margin-top: 8px; }
  button { font: inherit; font-size: clamp(16px, 2.4vw, 22px); font-weight: 700; padding: 14px 26px;
    border: 4px solid #2a1420; border-radius: 16px; cursor: pointer; color: #2a1420;
    box-shadow: 0 5px 0 #2a1420; transition: transform .08s; }
  button:active { transform: translateY(4px); box-shadow: 0 1px 0 #2a1420; }
  #here { background: #ffb347; }
  #blank { background: #9fd3ff; }
  .small { font-size: 14px; opacity: .65; max-width: 560px; }
  #frame { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: none; background: #000; }
</style>
</head>
<body>
<div class="menu" id="menu">
  <h1>BRIELANDS</h1>
  <p>A cheese adventure. Don't melt. Don't freeze. Choose your ending.</p>
  <div class="buttons">
    <button id="here">▶ Play here</button>
    <button id="blank">Open in about:blank</button>
  </div>
  <p class="small">WASD move · Space jump · Shift roll · Mouse look (or hold right-click / arrow keys) · E or click use ·
    Tab craft · 1-6 tools · Q throw · F eat · G offer a grape · R feed the Mold · Esc pause</p>
</div>
<iframe id="frame" allow="fullscreen; autoplay; gamepad" allowfullscreen></iframe>
<script>
  // Browser games can't load from a file:// page, so explain how to run it locally.
  if (location.protocol === "file:") {
    document.querySelector(".buttons").outerHTML =
      '<p style="max-width:560px;color:#ffd38a">This page has to be opened through a web server.<br>' +
      'On the Mac, double-click <b>Play in browser.command</b> in the v8 folder.</p>';
  }
  // The game build lives next to this page in files/ (a neutral name: school filters block URLs with "game" in them).
  const gameUrl = new URL("files/index.html", window.location.href).href;

  const here = document.getElementById("here");
  if (here) here.onclick = () => {
    const f = document.getElementById("frame");
    f.src = gameUrl;
    f.style.display = "block";
    document.getElementById("menu").style.display = "none";
    f.focus();
  };

  const blank = document.getElementById("blank");
  if (blank) blank.onclick = () => {
    const w = window.open("about:blank", "_blank");
    if (!w) {
      alert("Your browser blocked the new tab. Allow pop-ups for this site, or use Play here.");
      return;
    }
    w.document.title = "Brielands";
    const s = w.document.body.style;
    s.margin = "0"; s.height = "100vh"; s.overflow = "hidden"; s.background = "#000";
    const f = w.document.createElement("iframe");
    f.src = gameUrl;
    f.setAttribute("allow", "fullscreen; autoplay; gamepad");
    f.allowFullscreen = true;
    f.style.cssText = "border:0;width:100%;height:100%;display:block";
    w.document.body.appendChild(f);
  };
</script>
</body>
</html>
